# 数字资产处置情报驾驶舱 —— Nginx 反向代理（二级域名 + HTTPS）
# 用法：将 monitor.muhub.cn 替换为你的正式网站二级域名（如 monitor.example.com）
#       将证书路径替换为你的阿里云 SSL 证书路径。

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name monitor.muhub.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name monitor.muhub.cn;

    ssl_certificate     /etc/nginx/certs/monitor.muhub.cn.pem;
    ssl_certificate_key /etc/nginx/certs/monitor.muhub.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/dzs-access.log;
    error_log  /var/log/nginx/dzs-error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 应用层已内置邀请码访问控制，Nginx 无需再额外鉴权
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;      # 供"立即扫描"长请求
        proxy_send_timeout 120s;
    }

    # 大文件/静态资源缓存
    location /static/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }
}
